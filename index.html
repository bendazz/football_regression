<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Linear Regression Tutorial</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Linear Regression</h1>
  </header>

  <main>
    <section class="controls minimal">
      <button id="btnGenerate" class="primary">Generate sample data</button>
      <button id="btnDownloadCsv" title="Download current data as CSV">Download CSV</button>
      <div class="control-inline">
        <label for="bSlider">y =</label>
        <input id="bSlider" type="range" min="-50" max="150" step="1" value="50" />
        <span id="bValue" class="mono" aria-live="polite">50</span>
      </div>
      <div class="control-inline">
        <label for="mSlider">slope m =</label>
        <input id="mSlider" type="range" min="-3" max="3" step="0.1" value="1" />
        <span id="mValue" class="mono" aria-live="polite">1.0</span>
      </div>
    </section>

    <section class="chart-wrap">
      <canvas id="regressionChart" aria-label="Scatter plot with regression line" role="img"></canvas>
    </section>
    <section class="info-row" aria-live="polite">
      ȳ = <span id="meanYValue">—</span>
    </section>
  </main>

  

  <script src="app.js"></script>
</body>
</html>
